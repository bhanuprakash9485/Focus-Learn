<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FocusLearn — An AI-powered learning platform that creates your roadmap, removes distractions, checks your understanding, and guides your next step."
    />
    <title>FocusLearn — Learn What Matters. Stay Focused.</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('focuslearn-theme')
          var pref =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* Theme storage unavailable — the default light theme applies. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
